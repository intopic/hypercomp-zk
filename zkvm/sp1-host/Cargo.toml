[package]
name = "hypercomp-sp1-host"
version = "0.2.0"
edition = "2021"
description = "End-to-end Succinct SP1 v6 CUDA GPU benchmark & adversarial security verification host for Al-Samawal HyperCompressor v3"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hypercomp-decoder = { path = "../../crates/hypercomp-decoder" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sp1-sdk = { version = "6.10.0", features = ["cuda"] }
tokio = { version = "1", features = ["full"] }

[build-dependencies]
sp1-build = "6.10.0"

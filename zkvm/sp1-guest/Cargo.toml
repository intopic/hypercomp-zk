[package]
name = "hypercomp-sp1-guest"
version = "0.2.0"
edition = "2021"
description = "Succinct SP1 zkVM guest program verifying Al-Samawal HyperCompressor state-diff blobs"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
sp1-zkvm = "4.0"
hypercomp-decoder = { path = "../../crates/hypercomp-decoder", default-features = false, features = ["zstd-nostd"] }

# Enable Succinct SP1 hardware-accelerated SHA-256 precompile for `sha2 0.10` (`N-5`).
# Without this patch, SHA-256 runs in pure software (~6.56M RV32IM instructions per 112 KB dict).
[patch.crates-io]
sha2-v0-10-8 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-4.0.0" }

[package]
name = "hypercomp-risc0-guest"
version = "0.2.0"
edition = "2021"
description = "RISC Zero zkVM guest program verifying Al-Samawal HyperCompressor state-diff blobs"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
risc0-zkvm = { version = "3.0", default-features = false, features = ["std"] }
hypercomp-decoder = { path = "../../crates/hypercomp-decoder", default-features = false, features = ["zstd-nostd"] }

# Enable RISC Zero hardware-accelerated SHA-256 precompile for `sha2 0.10.9` (`N-5` / `D-1`).
# Without this patch, SHA-256 runs in pure software (~6.56M RV32IM instructions per 112 KB dict).
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }

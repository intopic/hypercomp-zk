[package]
name = "hypercomp-risc0-guest"
version = "0.2.0"
edition = "2021"
description = "RISC Zero zkVM guest program verifying Al-Samawal HyperCompressor state-diff blobs"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
risc0-zkvm = { version = "1.2", default-features = false, features = ["std"] }
hypercomp-decoder = { path = "../../crates/hypercomp-decoder", default-features = false, features = ["zstd-nostd"] }

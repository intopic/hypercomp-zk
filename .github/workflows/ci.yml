name: CI (Open-Source Decoder & RISC-V zkVM)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32im-unknown-none-elf

      - name: Run unit & adversarial tests (incl. PoC regression & fuzz suite)
        run: cargo test --workspace --all-features --locked

      - name: Run Clippy lints (zero warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check pure #![no_std] zero-dependency build (RV32IM)
        run: cargo check -p hypercomp-decoder --target riscv32im-unknown-none-elf --no-default-features

      - name: Check #![no_std] + pure-Rust ruzstd build (RV32IM)
        run: cargo check -p hypercomp-decoder --target riscv32im-unknown-none-elf --no-default-features --features zstd-nostd

      - name: Build bare-metal RV32IM zkVM guest ELF
        working-directory: zkvm/riscv-guest
        run: cargo build --release

      - name: Verify crates.io package dry-run
        run: cargo publish -p hypercomp-decoder --dry-run

  # R3-4: compile the zkVM integration templates (also resolves & verifies the sha2 precompile
  # [patch.crates-io] tags) so they can never silently rot.
  sp1-guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install SP1 toolchain (pinned to v6.10.0 matching sp1-guest)
        run: |
          curl -L https://sp1up.succinct.xyz | bash
          ~/.sp1/bin/sp1up -v v6.10.0
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - name: Build SP1 guest ELF
        working-directory: zkvm/sp1-guest
        run: cargo prove build

  # GPU_TEST_PLAN.md steps 2.1-2.4 on a CPU runner: decoder tests, 8 fixtures (107-byte journals vs
  # expected_manifest.json), HC == Raw Zstd lossless parity and the 7/7 live security suite (S1-S7)
  # executed inside the real SP1 v6 zkVM. Real CUDA proofs (step 2.5) still need a GPU machine.
  sp1-execute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libssl-dev
      - name: Install SP1 toolchain (pinned to v6.10.0 matching sp1-guest)
        run: |
          curl -L https://sp1up.succinct.xyz | bash
          ~/.sp1/bin/sp1up -v v6.10.0
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - name: Run SP1 execute-only suite (fixtures + 7/7 security tests)
        working-directory: zkvm/sp1-host
        run: bash run_sp1_gpu_bench.sh --execute-only
      - name: Upload execute report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sp1-execute-report
          path: |
            zkvm/sp1-host/sp1_execute_report.*
            zkvm/sp1-host/Cargo.lock
            zkvm/sp1-guest/Cargo.lock
          if-no-files-found: warn

  risc0-guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RISC Zero toolchain
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          ~/.risc0/bin/rzup install
      # Official risc0-build pipeline (correct rustflags, linker script and getrandom backend);
      # builds `zkvm/risc0-guest` locally (no Docker) so `../../crates/hypercomp-decoder` resolves.
      - name: Build RISC Zero guest ELF + image ID via risc0-build
        working-directory: zkvm/risc0-methods
        run: cargo test --release

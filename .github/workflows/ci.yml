name: CI (Open-Source Decoder & RISC-V zkVM)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32im-unknown-none-elf

      - name: Run unit & adversarial tests (incl. PoC regression & fuzz suite)
        run: cargo test --workspace --all-features --locked

      - name: Run Clippy lints (zero warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check pure #![no_std] zero-dependency build (RV32IM)
        run: cargo check -p hypercomp-decoder --target riscv32im-unknown-none-elf --no-default-features

      - name: Check #![no_std] + pure-Rust ruzstd build (RV32IM)
        run: cargo check -p hypercomp-decoder --target riscv32im-unknown-none-elf --no-default-features --features zstd-nostd

      - name: Build bare-metal RV32IM zkVM guest ELF
        working-directory: zkvm/riscv-guest
        run: cargo build --release

      - name: Verify crates.io package dry-run
        run: cargo publish -p hypercomp-decoder --dry-run

  # R3-4: compile the zkVM integration templates (also resolves & verifies the sha2 precompile
  # [patch.crates-io] tags) so they can never silently rot.
  sp1-guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install SP1 toolchain (pinned to v6.10.0 matching sp1-guest)
        run: |
          curl -L https://sp1up.succinct.xyz | bash
          ~/.sp1/bin/sp1up -v v6.10.0
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - name: Build SP1 guest ELF
        working-directory: zkvm/sp1-guest
        run: cargo prove build

  risc0-guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RISC Zero toolchain
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          ~/.risc0/bin/rzup install
      - name: Build RISC Zero guest ELF (native +risc0 toolchain resolves ../../crates/hypercomp-decoder)
        working-directory: zkvm/risc0-guest
        run: cargo +risc0 build --release --target riscv32im-risc0-zkvm-elf
